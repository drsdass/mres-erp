<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Quote Request · Mass Renewable</title>
<link rel="icon" href="/icon-192.png">
<style>
:root{--ink:#0f172a;--ink2:#475569;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--card:#fff;--brand:#0f2a3d;--accent:#22b8d6;--ok:#047857;--bad:#b91c1c;--soft:#f8fafc}
@media (prefers-color-scheme:dark){:root{--ink:#e2e8f0;--ink2:#cbd5e1;--muted:#94a3b8;--line:#334155;--bg:#0b1220;--card:#111a2b;--soft:#0f1729}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
header{background:var(--brand);color:#fff;padding:14px 16px}header .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px}.logo img{width:36px;height:36px;border-radius:8px}.logo b{display:block;letter-spacing:.06em;font-size:15px}.logo small{display:block;font-size:10.5px;letter-spacing:.18em;opacity:.75}
.lang{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden}.lang button{background:none;border:0;color:#fff;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer}.lang button.on{background:rgba(255,255,255,.18);font-weight:700}
main{max-width:760px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 12px}.muted{color:var(--muted)}.sm{font-size:14px}
.need{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px}.need dt{color:var(--muted)}.need dd{margin:0;font-weight:600;white-space:pre-wrap;word-break:break-word}
.match{display:inline-block;margin-top:10px;padding:6px 10px;border-radius:8px;font-weight:600;font-size:14px}.match.exact{background:#fef2f2;color:#991b1b}.match.equiv{background:#ecfdf5;color:#065f46}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}label.f small{font-weight:400;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.price{display:grid;grid-template-columns:1fr 96px;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:8px}.seg label{flex:1;min-width:120px}.seg input{position:absolute;opacity:0;width:auto}.seg span{display:block;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;font-weight:600;font-size:14px;cursor:pointer}.seg input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff}.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.tiers>span{display:block;font-weight:600;font-size:14px;margin-bottom:6px}.tiers .row{display:grid;grid-template-columns:1fr 1fr 40px;gap:8px;margin-bottom:8px}.tiers button.x{border:1px solid var(--line);background:none;border-radius:10px;color:var(--muted);cursor:pointer;font-size:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 22px;font:inherit;font-weight:700;cursor:pointer}.btn.primary{background:var(--accent);color:#fff;width:100%;font-size:17px}.btn.ghost{background:none;border:1px dashed var(--line);color:var(--ink2);padding:8px 12px;font-weight:600;font-size:14px}
.btn[disabled]{opacity:.6;cursor:wait}
.err{background:#fef2f2;color:var(--bad);border:1px solid #fecaca;padding:10px 12px;border-radius:10px;font-weight:600;margin-top:12px}
.done{text-align:center;padding:36px 18px}.done .tick{width:64px;height:64px;border-radius:50%;background:#d1fae5;color:var(--ok);display:inline-flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:10px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.note{font-size:13px;color:var(--muted);margin-top:14px}
@media (max-width:560px){.grid{grid-template-columns:1fr}.need{grid-template-columns:1fr}.need dt{margin-top:6px}}
</style>
</head>
<body>
<header><div class="in"><div class="logo"><img src="/icon-192.png" alt=""><div><b>MASS RENEWABLE</b><small>ENERGY SOLUTIONS</small></div></div>
<div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en" class="on">English</button><button type="button" data-lang="zh">中文</button></div></div></header>
<main id="app"><div class="card"><p class="muted" data-t="loading">Loading…</p></div></main>
<script>
const FN='https://ttjardwybyezgtccdath.supabase.co/functions/v1/vendor-quote';
const T={
 en:{loading:'Loading…',title:'Quote request',for:'For',need:'What we need',part:'Part',pn:'Part number',qty:'Quantity',specs:'Details',needBy:'Needed by',exact:'Exact part only. Please quote the same brand and part number.',equiv:'Equivalent parts are welcome. Tell us the brand and model you are offering.',
  yourQuote:'Your quote',price:'Price per unit',moq:'Minimum order (MOQ)',lead:'Lead time (days)',terms:'Price terms',termsHelp:'EXW, FOB, etc.',ship:'Shipping per unit to the USA (optional)',sample:'Sample cost (optional)',pay:'Payment terms (optional)',payPh:'e.g. 100% before shipping',valid:'Price valid for (days)',
  offer:'What are you offering?',original:'Original part',equivalent:'Equivalent part',refurb:'Refurbished',brand:'Brand',model:'Model / part number you are quoting',tiers:'Volume pricing (optional)',tierQty:'Quantity',tierPrice:'Price per unit',addTier:'+ Add a price break',
  files:'Datasheet or photos (optional)',filesHelp:'Up to 3 files, 10 MB each',notes:'Anything else? (optional)',you:'Your contact',name:'Your name',email:'Your email (optional)',send:'Send quote',update:'Update my quote',sending:'Sending…',
  sentBefore:'You sent a quote on',sentBefore2:'Your answers are filled in below. Change anything and send again to update it.',
  thanks:'Thank you! Your quote was sent.',thanks2:'Our team will review it and reply. You can update your quote any time using this same link.',again:'Change my quote',
  closed:'This request is closed. Thank you for your interest.',needPrice:'Please enter your price per unit.',privacy:'Your quote goes only to the Mass Renewable sourcing team.',days:'days'},
 zh:{loading:'加载中…',title:'询价单',for:'致',need:'我们需要的产品',part:'产品',pn:'型号 / 料号',qty:'数量',specs:'详细要求',needBy:'需要日期',exact:'仅限原装正品，请报相同品牌和型号。',equiv:'可接受替代品，请注明您提供的品牌和型号。',
  yourQuote:'您的报价',price:'单价',moq:'最小起订量 (MOQ)',lead:'交货期（天）',terms:'价格条款',termsHelp:'EXW、FOB 等',ship:'到美国的每件运费（可选）',sample:'样品费（可选）',pay:'付款方式（可选）',payPh:'例如：发货前 100% 付款',valid:'报价有效期（天）',
  offer:'您提供的是？',original:'原装件',equivalent:'替代件',refurb:'翻新件',brand:'品牌',model:'您报价的型号 / 料号',tiers:'阶梯价格（可选）',tierQty:'数量',tierPrice:'单价',addTier:'+ 添加阶梯价',
  files:'规格书或照片（可选）',filesHelp:'最多 3 个文件，每个 10 MB',notes:'其他说明（可选）',you:'联系人',name:'您的姓名',email:'您的邮箱（可选）',send:'提交报价',update:'更新报价',sending:'提交中…',
  sentBefore:'您已于以下时间提交报价：',sentBefore2:'您之前的内容已填好。修改后再次提交即可更新。',
  thanks:'谢谢！您的报价已提交。',thanks2:'我们的团队会尽快查看并回复。您可以随时用同一个链接更新报价。',again:'修改报价',
  closed:'此询价已关闭，感谢您的关注。',needPrice:'请填写单价。',privacy:'您的报价仅发送给 Mass Renewable 采购团队。',days:'天'}};
let L=(()=>{try{return localStorage.getItem('mres-q-lang')||(/^zh/i.test(navigator.language)?'zh':'en')}catch(e){return 'en'}})();
const t=k=>(T[L]&&T[L][k])||T.en[k]||k;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tok=new URLSearchParams(location.search).get('t')||'';
let D=null,view='form',draft=null;
const app=document.getElementById('app');
function setLang(l){L=l;try{localStorage.setItem('mres-q-lang',l)}catch(e){}document.documentElement.lang=l==='zh'?'zh-CN':'en';document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));if(document.getElementById('qf'))draft=collect();draw()}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
function fail(msg){app.innerHTML=`<div class="card"><p class="err" style="margin:0">${esc(msg)}</p></div>`}
function collect(){const f=document.getElementById('qf');if(!f)return null;const o=Object.fromEntries(new FormData(f));delete o.files;o.tiers=[...f.querySelectorAll('.tiers .row')].map(r=>({qty:r.querySelector('[data-k=qty]').value,price:r.querySelector('[data-k=price]').value}));return o}
const tierRow=(x={})=>`<div class="row"><input data-k="qty" type="number" min="1" inputmode="numeric" placeholder="${esc(t('tierQty'))}" value="${esc(x.qty??'')}" aria-label="${esc(t('tierQty'))}"><input data-k="price" type="number" min="0" step="0.0001" inputmode="decimal" placeholder="${esc(t('tierPrice'))}" value="${esc(x.price??'')}" aria-label="${esc(t('tierPrice'))}"><button type="button" class="x" aria-label="Remove">×</button></div>`;
function draw(){
 if(!D)return;
 if(D.closed&&view!=='done'){app.innerHTML=`<div class="card"><h1>${esc(D.rfq)}</h1><p>${esc(D.title)}</p><p class="err">${esc(t('closed'))}</p></div>`;return}
 if(view==='done'){app.innerHTML=`<div class="card done"><div class="tick">✓</div><h1>${esc(t('thanks'))}</h1><p class="muted">${esc(t('thanks2'))}</p><p class="sm muted">${esc(D.rfq)} · ${esc(D.title)}</p><button class="btn ghost" id="again">${esc(t('again'))}</button></div>`;document.getElementById('again').onclick=()=>{view='form';draw();scrollTo(0,0)};return}
 const p=draft||D.prev||{};const v=k=>esc(p[k]??'');const sel=(k,val)=>String(p[k]??'')===val?'selected':'';const chk=(k,val)=>String(p[k]??'')===val?'checked':'';
 const tiers=(p.tiers&&p.tiers.length?p.tiers:[]);
 app.innerHTML=`
 <div class="card"><div class="muted sm">${esc(t('title'))} · ${esc(D.rfq)}${D.supplier?` · ${esc(t('for'))} ${esc(D.supplier)}`:''}</div><h1>${esc(D.title)}</h1>
  <dl class="need">${D.partNo?`<dt>${esc(t('pn'))}</dt><dd>${esc(D.partNo)}</dd>`:''}<dt>${esc(t('qty'))}</dt><dd>${esc(D.qty??'')} ${esc(D.unit||'')}</dd>${D.specs?`<dt>${esc(t('specs'))}</dt><dd>${esc(D.specs)}</dd>`:''}${D.needBy?`<dt>${esc(t('needBy'))}</dt><dd>${esc(new Date(D.needBy+'T12:00').toLocaleDateString(L==='zh'?'zh-CN':'en-US',{year:'numeric',month:'short',day:'numeric'}))}</dd>`:''}</dl>
  ${D.match?`<div class="match ${D.match}">${esc(t(D.match))}</div>`:''}</div>
 ${D.sentAt&&!draft?`<div class="card sm" style="background:#ecfeff;border-color:#a5f3fc;color:#155e75">${esc(t('sentBefore'))} <b>${esc(new Date(D.sentAt).toLocaleString(L==='zh'?'zh-CN':'en-US'))}</b>. ${esc(t('sentBefore2'))}</div>`:''}
 <form id="qf" class="card" novalidate><h2>${esc(t('yourQuote'))}</h2>
  <div class="grid">
   <label class="f full">${esc(t('price'))} *<div class="price"><input name="unitPrice" type="number" min="0" step="0.0001" inputmode="decimal" required value="${v('unitPrice')}"><select name="currency" aria-label="Currency">${['USD','CNY','EUR'].map(c=>`<option ${sel('currency',c)||(!p.currency&&c==='USD'?'selected':'')}>${c}</option>`).join('')}</select></div></label>
   <label class="f">${esc(t('moq'))}<input name="moq" type="number" min="0" inputmode="numeric" value="${v('moq')}"></label>
   <label class="f">${esc(t('lead'))}<input name="leadDays" type="number" min="0" inputmode="numeric" value="${v('leadDays')}"></label>
   <label class="f">${esc(t('terms'))} <small>${esc(t('termsHelp'))}</small><select name="incoterm"><option value=""></option>${['EXW','FOB','FCA','CFR','CIF','DAP','DDP'].map(c=>`<option ${sel('incoterm',c)}>${c}</option>`).join('')}</select></label>
   <label class="f">${esc(t('valid'))}<input name="validDays" type="number" min="0" inputmode="numeric" value="${v('validDays')||''}" placeholder="30"></label>
   <label class="f">${esc(t('ship'))}<input name="shipPerUnit" type="number" min="0" step="0.01" inputmode="decimal" value="${v('shipPerUnit')}"></label>
   <label class="f">${esc(t('sample'))}<input name="sampleCost" type="number" min="0" step="0.01" inputmode="decimal" value="${v('sampleCost')}"></label>
   <label class="f full">${esc(t('pay'))}<input name="paymentTerms" maxlength="120" placeholder="${esc(t('payPh'))}" value="${v('paymentTerms')}"></label>
   <div class="f full"><label class="f" style="margin-bottom:6px" id="offer-l">${esc(t('offer'))}</label><div class="seg" role="radiogroup" aria-labelledby="offer-l">
    <label><input type="radio" name="condition" value="original" ${chk('condition','original')}><span>${esc(t('original'))}</span></label>
    <label><input type="radio" name="condition" value="equivalent" ${chk('condition','equivalent')}><span>${esc(t('equivalent'))}</span></label>
    <label><input type="radio" name="condition" value="refurbished" ${chk('condition','refurbished')}><span>${esc(t('refurb'))}</span></label></div></div>
   <label class="f">${esc(t('brand'))}<input name="brand" maxlength="80" value="${v('brand')}"></label>
   <label class="f">${esc(t('model'))}<input name="part" maxlength="120" value="${v('part')}"></label>
   <div class="f full tiers"><span>${esc(t('tiers'))}</span><div id="tiers">${tiers.map(tierRow).join('')}</div><button type="button" class="btn ghost" id="addTier">${esc(t('addTier'))}</button></div>
   <label class="f full">${esc(t('files'))} <small>${esc(t('filesHelp'))}</small><input name="files" type="file" multiple accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx"></label>
   <label class="f full">${esc(t('notes'))}<textarea name="notes" rows="4" maxlength="2000">${v('notes')}</textarea></label>
  </div>
  <h2 style="margin-top:20px">${esc(t('you'))}</h2>
  <div class="grid"><label class="f">${esc(t('name'))}<input name="contactName" maxlength="80" autocomplete="name" value="${v('contactName')}"></label><label class="f">${esc(t('email'))}<input name="contactEmail" type="email" maxlength="120" autocomplete="email" value="${v('contactEmail')}"></label></div>
  <div class="hp" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
  <div id="msg"></div>
  <button class="btn primary" type="submit" style="margin-top:16px">${esc(D.prev?t('update'):t('send'))}</button>
  <p class="note">${esc(t('privacy'))}</p>
 </form>`;
 const tw=document.getElementById('tiers');document.getElementById('addTier').onclick=()=>{if(tw.children.length<6)tw.insertAdjacentHTML('beforeend',tierRow())};
 tw.addEventListener('click',e=>{if(e.target.classList.contains('x'))e.target.closest('.row').remove()});
 document.getElementById('qf').onsubmit=submit;
}
async function submit(e){e.preventDefault();const f=e.target,msg=document.getElementById('msg'),b=f.querySelector('[type=submit]');msg.innerHTML='';
 if(!(+f.unitPrice.value>0)){msg.innerHTML=`<div class="err">${esc(t('needPrice'))}</div>`;f.unitPrice.focus();return}
 const files=[...f.files.files];if(files.length>3||files.some(x=>x.size>10*1024*1024)){msg.innerHTML=`<div class="err">${esc(t('filesHelp'))}</div>`;return}
 const fd=new FormData(f);fd.delete('files');files.forEach(x=>fd.append('files',x));fd.set('t',tok);fd.set('tiers',JSON.stringify(collect().tiers.filter(x=>x.qty&&x.price)));
 b.disabled=true;b.textContent=t('sending');
 try{const r=await fetch(FN,{method:'POST',body:fd});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.error||'Error '+r.status);
  const c=collect();D.prev={...c,tiers:c.tiers.filter(x=>x.qty&&x.price)};D.sentAt=new Date().toISOString();draft=null;view='done';draw();scrollTo(0,0)}
 catch(err){msg.innerHTML=`<div class="err">${esc(err.message)}</div>`;b.disabled=false;b.textContent=D.prev?t('update'):t('send')}}
(async()=>{setLang(L);if(!/^[A-Za-z0-9_-]{20,64}$/.test(tok))return fail('This link is not complete. Please open the full link you received. / 链接不完整，请打开完整链接。');
 try{const r=await fetch(FN+'?t='+encodeURIComponent(tok));const j=await r.json().catch(()=>({}));if(!r.ok)return fail(j.error||'Could not load this request.');D=j;draw()}catch(e){fail('Could not connect. Please check your internet and try again. / 无法连接，请检查网络后重试。')}})();
</script>
</body>
</html>
