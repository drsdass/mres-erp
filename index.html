<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mass Renewable ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Raleway:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ECEEEF;--surface:#FFFFFF;--surface-2:#F5F6F7;--ink:#1A1E22;--ink-2:#545B62;--ink-3:#838A90;--line:#D8DCDF;
  --grid:#1289AC;--grid-soft:#DFF2F8;--cyan:#3EC9E6;--cyan-ink:#0C1A20;--sun:#D8962B;--sun-soft:#FBEFD9;--wind:#5A9934;--wind-soft:#E5F0DB;
  --alert:#BC3B31;--alert-soft:#F7E2DF;--ok:#2E8350;--ok-soft:#DFF0E5;--side:#1B1E21;--side-ink:#B4B9BD;--hero:#1B1E21;
  --fh:'Raleway','Barlow',system-ui,sans-serif;
  --shadow:0 14px 44px rgba(10,25,40,.2);color-scheme:light;
  --f:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --fc:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111315;--surface:#1A1D20;--surface-2:#202428;--ink:#E6E8EA;--ink-2:#A6ACB1;--ink-3:#767D83;--line:#2C3135;
  --grid:#3EC9E6;--grid-soft:#123039;--sun:#EBAE4A;--sun-soft:#392D17;--wind:#7DB84F;--wind-soft:#1D2E14;
  --alert:#E3685D;--alert-soft:#3C1F1C;--ok:#56B67B;--ok-soft:#173223;--side:#0B0C0E;--side-ink:#A8ADB2;--hero:#0B0C0E;--shadow:0 14px 44px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111315;--surface:#1A1D20;--surface-2:#202428;--ink:#E6E8EA;--ink-2:#A6ACB1;--ink-3:#767D83;--line:#2C3135;
  --grid:#3EC9E6;--grid-soft:#123039;--sun:#EBAE4A;--sun-soft:#392D17;--wind:#7DB84F;--wind-soft:#1D2E14;
  --alert:#E3685D;--alert-soft:#3C1F1C;--ok:#56B67B;--ok-soft:#173223;--side:#0B0C0E;--side-ink:#A8ADB2;--hero:#0B0C0E;--shadow:0 14px 44px rgba(0,0,0,.5);color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden}
.side,.mainwrap,main{min-height:0}
.tabs{overflow-y:hidden}

/* sidebar */
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 10px;text-decoration:none}
.brand{padding:20px 16px 12px}
.brand b{font:800 15.5px/1.05 var(--fh);color:#fff;letter-spacing:.01em;display:block;white-space:nowrap}
.brand small{display:block;font:700 8.5px var(--fh);letter-spacing:.2em;color:var(--side-ink);margin-top:3px}
.nav{padding:4px 10px 12px}
.nav h6{margin:14px 10px 4px;font:500 12.5px var(--f);color:#80878D}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:6px;color:var(--side-ink);text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 0 var(--cyan)}
.nav .cnt{margin-left:auto;font-size:12px;line-height:18px;background:rgba(255,255,255,.12);padding:0 7px;border-radius:9px;color:#fff}
.nav .cnt.hot{background:var(--alert)}
.side-foot{margin-top:auto;padding:14px 18px 18px;font-size:12.5px;color:#80878D;border-top:1px solid rgba(255,255,255,.07);line-height:1.6}
.side-foot a{color:var(--cyan)}

/* top bar */
.mainwrap{display:flex;flex-direction:column;min-width:0;height:100%}
.top{display:flex;align-items:center;gap:6px;padding:10px 24px;border-bottom:1px solid var(--line);background:var(--surface);position:relative;z-index:30}
.searchbtn{flex:0 1 400px;display:flex;align-items:center;gap:9px;padding:8px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);color:var(--ink-3);font:inherit;cursor:pointer;text-align:left;margin-right:auto}
.searchbtn kbd{margin-left:auto;font:12px var(--f);border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--ink-3)}
.icon-btn{position:relative;width:38px;height:38px;display:grid;place-items:center;border:0;background:transparent;color:var(--ink-2);border-radius:7px;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.badge{position:absolute;top:3px;right:2px;min-width:17px;height:17px;border-radius:9px;background:var(--alert);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--hero);color:var(--cyan);display:grid;place-items:center;font-weight:600;border:0;cursor:pointer;margin-left:4px;font-family:var(--f)}
.menu-btn{display:none}
.dd{position:absolute;right:16px;top:calc(100% + 6px);width:min(360px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);overflow:hidden}
.dd header{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;display:flex;justify-content:space-between}
.dd .item{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-bottom:1px solid var(--line);text-decoration:none;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font:inherit;color:inherit}
.dd .item:last-child{border-bottom:0}
.dd .item:hover{background:var(--surface-2)}

/* page */
main{flex:1;overflow:auto;padding:22px 28px 64px}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.phead h1{margin:0;font:800 29px/1.1 var(--fh);letter-spacing:.015em;text-transform:uppercase}
.phead .sub{margin:5px 0 0;color:var(--ink-2);max-width:72ch}
.crumb{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);text-decoration:none;font-size:14px;margin-bottom:8px}
.crumb:hover{color:var(--grid)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px/1.3 var(--f);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--cyan);border-color:var(--cyan);color:var(--cyan-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--alert)}
.link{color:var(--grid);cursor:pointer;font:inherit;font-weight:500;text-decoration:none;background:none;border:0;padding:0}
.link:hover{text-decoration:underline}
.muted{color:var(--ink-3)} .sm{font-size:13px} .grow{flex:1;min-width:0} .nowrap{white-space:nowrap}
.mb{margin-bottom:18px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:18px}
.kpi{background:var(--surface);padding:13px 18px 14px}
.kpi .l{font-size:13px;color:var(--ink-2)}
.kpi .v{font:600 29px/1.15 var(--fc);margin-top:3px}
.kpi .s{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.kpi .s.up{color:var(--ok)} .kpi .s.dn{color:var(--alert)}

.grid2{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:18px}
.grid2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph h3{margin:0;font:700 15.5px var(--fh)}
.pb{padding:14px 16px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--ink-2)}
.lg::before{content:'';display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.lg.wind::before{background:var(--wind)} .lg.sun::before{background:var(--sun)} .lg.grid::before{background:var(--grid)} .lg.alert::before{background:var(--alert)} .lg.line::before{background:var(--line)}

/* dashboard hero, echoes massrenewable.com */
.hero{position:relative;overflow:hidden;background:var(--hero);color:#fff;border-radius:8px;padding:28px 30px 26px;margin-bottom:18px;min-height:176px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 78% 110%,rgba(255,255,255,.2),transparent 55%),linear-gradient(180deg,#3A3F44 0%,rgba(27,30,33,0) 70%);pointer-events:none}
.hero>*{position:relative}
.hero h1{margin:0;font:800 clamp(26px,3.6vw,40px)/1.02 var(--fh);text-transform:uppercase;letter-spacing:.01em;max-width:18ch}
.hero p{margin:10px 0 0;font:600 12.5px var(--fh);letter-spacing:.14em;text-transform:uppercase;color:#B9BEC2}
.hero .actions .btn:not(.primary){background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.hero .actions .btn:not(.primary):hover{border-color:#fff}
.hero .tb{position:absolute;right:250px;bottom:-6px;width:170px;height:190px;opacity:.55;pointer-events:none}
.hero .rot{transform-origin:85px 52px;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:900px){.hero .tb{right:-20px;opacity:.3}}

/* inbox */
.inbox{display:grid;grid-template-columns:minmax(270px,360px) minmax(0,1fr);border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:560px;overflow:hidden}
.ilist{border-right:1px solid var(--line);overflow:auto;max-height:78vh}
.im{display:block;padding:11px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.im:hover{background:var(--surface-2)}
.im.on{background:var(--grid-soft);box-shadow:inset 3px 0 0 var(--cyan)}
.im .r1{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.im .nm{color:var(--ink);font-weight:500;display:inline-flex;align-items:center;gap:4px;min-width:0}
.im.unread .nm,.im.unread .s{font-weight:700}
.im .s{font-size:14px;margin:3px 0;line-height:1.3}
.im .p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.im .late{color:var(--alert);font-weight:600}
.idet{padding:18px 22px;min-width:0}
.ihead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ihead h2{margin:0 0 3px;font:700 20px/1.25 var(--fh)}
.ibar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:12px 0 16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ibar label{display:flex;align-items:center;gap:6px}
.ibar select{padding:5px 8px;font-size:13.5px}
.idgrid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px}
.msg{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.msg.out{background:var(--surface-2);margin-left:28px;border-left:3px solid var(--cyan)}
.msg header{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.msg header b{color:var(--ink)}
.msg .b{white-space:pre-wrap;font-size:14.5px;line-height:1.55;overflow-wrap:anywhere}
mark.skuhit{background:var(--sun-soft);color:inherit;border-radius:3px;padding:0 2px;font-weight:600}
.reply{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;margin-top:4px}
.reply .r1{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.reply select{font-size:13px;padding:5px 8px}
.iside section{padding:0 0 14px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.iside section:last-child{border-bottom:0}
.iside h4{margin:0 0 6px;font:700 12.5px var(--fh);color:var(--ink-2)}
.iact{display:flex;flex-wrap:wrap;gap:6px}
.iact h4{width:100%}
.lrec{padding:5px 0}
.stockbad{color:var(--alert)}
.note{display:flex;gap:6px;align-items:center;background:var(--grid-soft);border-radius:6px;padding:8px 10px;margin:0 0 14px;font-size:13.5px}
.mback{display:none}
@media (max-width:1250px){.idgrid{grid-template-columns:1fr}}
@media (max-width:900px){.inbox{grid-template-columns:1fr}.inbox.has-sel .ilist{display:none}.inbox:not(.has-sel) .idet{display:none}.mback{display:inline-flex}.idet{padding:14px}.msg.out{margin-left:12px}.ilist{max-height:none;border-right:0}}

/* audit changes */
.chg{font-size:12.5px;line-height:1.5;color:var(--ink-2)}
.chg>span:first-child{color:var(--ink-3)}
.chg s{color:var(--alert);text-decoration-thickness:1px}
.chg b{color:var(--ok);font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--ink-2);font-size:13px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
tr.click{cursor:pointer}
td.n,th.n{text-align:right}
td b{font-weight:600}
.panel>.tbl-wrap:first-child th:first-child{border-top-left-radius:8px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:4px;font-size:12.5px;font-weight:500;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;line-height:20px}
.chip::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--sun-soft);color:#9A6210} .chip.alert{background:var(--alert-soft);color:var(--alert)}
.chip.info{background:var(--grid-soft);color:var(--grid)} .chip.wind{background:var(--wind-soft);color:var(--wind)} .chip.plain::before{display:none}
:root[data-theme="dark"] .chip.warn{color:var(--sun)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.warn{color:var(--sun)}}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;font:500 14.5px var(--f);color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-color:var(--grid)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.input,select,textarea{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-width:0}
textarea{resize:vertical;min-height:70px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:6px 11px;font:500 13.5px var(--f);color:var(--ink-2);cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--grid-soft);color:var(--grid)}
.check-inline{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2)}

/* boards */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:180px}
.col>header{padding:10px 12px;display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px;border-bottom:1px solid var(--line)}
.col>header small{font-weight:500;color:var(--ink-3)}
.col .items{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1}
.col.over{outline:2px dashed var(--grid);outline-offset:-4px}
.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 11px;cursor:pointer;font-size:13.5px;text-decoration:none;color:inherit}
.card:hover{border-color:var(--ink-3)}
.card[draggable="true"]{cursor:grab}
.card.dragging{opacity:.45}
.card .t{font-weight:600;font-size:14.5px;margin:3px 0 5px;line-height:1.25}
.card .m{color:var(--ink-2);font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px}
.card.p-Urgent{box-shadow:inset 3px 0 0 var(--alert)} .card.p-High{box-shadow:inset 3px 0 0 var(--cyan)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--grid);border-radius:3px}
.bar.sun i{background:var(--sun)} .bar.alert i{background:var(--alert)} .bar.ok i{background:var(--ok)}

/* stage rail — the signature element */
.rail-wrap{overflow-x:auto;margin-bottom:18px}
.rail{display:grid;grid-template-columns:repeat(7,minmax(104px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 8px 14px;min-width:728px}
.rnode{position:relative;text-align:center;font-size:13.5px;color:var(--ink-3);padding:0 4px}
.rnode::before{content:'';position:absolute;top:10px;left:-50%;right:50%;height:3px;background:var(--line)}
.rnode:first-child::before{display:none}
.rnode.done::before,.rnode.cur::before{background:var(--grid)}
.rnode .dot{position:relative;z-index:1;display:grid;place-items:center;width:23px;height:23px;margin:0 auto 7px;border-radius:50%;background:var(--surface);border:3px solid var(--line);color:#fff}
.rnode.done{color:var(--ink)} .rnode.done .dot{background:var(--grid);border-color:var(--grid)}
.rnode.cur{color:var(--ink);font-weight:600}
.rnode.cur .dot{border-color:var(--cyan);background:var(--grid-soft);animation:pulse 2.4s ease-out infinite}
.rnode .d{display:block;font-size:12px;color:var(--ink-3);font-weight:400;margin-top:1px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(62,201,230,.6)}70%{box-shadow:0 0 0 11px rgba(62,201,230,0)}100%{box-shadow:0 0 0 0 rgba(62,201,230,0)}}

/* stage strip on dashboard */
.stagestrip{display:grid;grid-template-columns:repeat(7,minmax(128px,1fr));overflow-x:auto}
.ss{padding:12px 12px 14px;border-left:1px solid var(--line);min-width:128px}
.ss:first-child{border-left:0}
.ssh{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.ssh b{font:600 22px var(--fc);color:var(--ink)}
.ssp{display:block;text-decoration:none;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px;font-weight:500;line-height:1.25}
.ssp:hover span{color:var(--grid)}
.ssp small{display:block;color:var(--ink-3);font-weight:400;font-size:12px;margin-top:1px}

/* gantt */
.gantt{position:relative;min-width:680px}
.g-row{display:grid;grid-template-columns:190px 1fr;align-items:center;border-top:1px solid var(--line);min-height:40px}
.g-row.head{border-top:0;min-height:26px;font-size:12px;color:var(--ink-3)}
.g-lab{font-size:13.5px;font-weight:500;padding-right:10px;line-height:1.2}
.g-lab small{display:block;color:var(--ink-3);font-weight:400;font-size:12px}
.g-lab a{text-decoration:none} .g-lab a:hover{color:var(--grid)}
.g-track{position:relative;height:40px}
.g-bar{position:absolute;top:11px;height:18px;border-radius:4px;background:var(--grid-soft);border:1px solid var(--grid);overflow:hidden}
.g-bar i{display:block;height:100%;background:var(--grid)}
.g-bar.cur{border-color:var(--cyan);background:var(--grid-soft)} .g-bar.cur i{background:var(--cyan)}
.g-bar.todo{border-color:var(--line);background:var(--surface-2)}
.g-seg{position:absolute;top:12px;height:16px}
.g-seg.done{background:var(--grid)} .g-seg.cur{background:var(--cyan)} .g-seg.todo{background:var(--line)}
.g-seg:first-of-type{border-radius:4px 0 0 4px}
.g-ov{position:absolute;left:190px;right:0;top:0;bottom:0;pointer-events:none}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--alert)}
.g-today span{position:absolute;top:-2px;left:4px;font-size:11.5px;color:var(--alert);font-weight:600;white-space:nowrap}
.g-tick{position:absolute;top:0;font-size:12px;color:var(--ink-3);transform:translateX(-50%);white-space:nowrap}
.g-grid{position:absolute;top:26px;bottom:0;width:1px;background:var(--line);opacity:.6}

/* fleet */
.site{margin-bottom:18px}
.site .ph{border-bottom:1px solid var(--line)}
.fleet{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:8px;padding:14px 16px}
.tile{border:1px solid var(--line);border-radius:6px;padding:8px 10px 9px;background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:inherit}
.tile:hover{border-color:var(--ink-3)}
.tile .id{font-weight:600;font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
.tile .o{font:600 20px/1.15 var(--fc);margin-top:3px}
.tile .o small{font:500 12px var(--f);color:var(--ink-3)}
.tile .st{font-size:12px;color:var(--ink-3)}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.s-Derated .sdot{background:var(--sun)} .s-Fault .sdot{background:var(--alert)} .s-Maintenance .sdot{background:var(--grid)}
.tile.s-Fault{border-color:var(--alert);background:var(--alert-soft)}
.tile.s-Derated{border-color:var(--sun)}
.tile.s-Maintenance{border-color:var(--grid);background:var(--grid-soft)}

/* lists */
.alist{list-style:none;margin:0;padding:0}
.alist li{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-top:1px solid var(--line)}
.alist li:first-child{border-top:0}
.alist .muted{font-size:12.5px}
.checklist{list-style:none;margin:0;padding:0}
.checklist li{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.checklist li:first-child{border-top:0}
.cbx{width:20px;height:20px;border-radius:4px;border:1.5px solid var(--ink-3);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:#fff;flex:none;padding:0}
.cbx.on{background:var(--grid);border-color:var(--grid)}
.lg.cyan::before{background:var(--cyan)}
.cbx:disabled{cursor:default;opacity:.6}
li.donetext span.txt{color:var(--ink-3);text-decoration:line-through}
details.stg{border-top:1px solid var(--line)}
details.stg:first-of-type{border-top:0}
details.stg summary{cursor:pointer;padding:10px 0;display:flex;justify-content:space-between;gap:10px;font-weight:500;list-style:none}
details.stg summary::-webkit-details-marker{display:none}
details.stg summary::before{content:'▸';color:var(--ink-3);margin-right:4px}
details.stg[open] summary::before{content:'▾'}
details.stg summary span:first-child{flex:1}
details.stg .checklist{padding-bottom:8px}
.hbar{display:grid;grid-template-columns:130px 1fr 110px;gap:10px;align-items:center;padding:7px 0;font-size:13.5px}
.hbar .tr{position:relative;height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.hbar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--grid-soft);border-right:2px solid var(--grid)}
.hbar .tr b{position:absolute;left:0;top:4px;height:6px;background:var(--grid);border-radius:3px}
.hbar .tr b.over{background:var(--alert)}
.bignum{font:700 84px/1 var(--fc);color:var(--ok)}
.inline-form{display:flex;gap:8px;margin-top:10px}
.inline-form .input{flex:1}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0}
.pager{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--ink-2)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(8,20,30,.48);z-index:50}
.modal{position:fixed;z-index:51;top:50%;left:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 24px));max-height:calc(100% - 48px);display:flex;flex-direction:column;background:var(--surface);border-radius:10px;box-shadow:var(--shadow);border:1px solid var(--line);margin:0}
.modal.wide{width:min(880px,calc(100vw - 24px))}
.modal>header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal>header h2{margin:0;font:800 19px/1.2 var(--fh)}
.mbody{padding:16px 18px;overflow:auto}
.modal>footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.f.full{grid-column:1/-1}
.f input,.f select,.f textarea{width:100%}
.lines{width:100%;margin-top:4px}
.lines td{padding:5px 4px;border:0}
.lines th{background:none;padding:4px}
.lines select,.lines input{width:100%}
.totals{display:flex;justify-content:flex-end;gap:24px;margin-top:10px;font-size:14px}
.totals b{font:600 20px var(--fc)}
.pal{position:fixed;z-index:51;top:12%;left:50%;transform:translateX(-50%);width:min(620px,calc(100vw - 24px));background:var(--surface);border-radius:10px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.pal input{border:0;border-bottom:1px solid var(--line);padding:15px 18px;font:16px var(--f);width:100%;background:transparent;color:var(--ink);outline:none}
.pal .res{max-height:52vh;overflow:auto;padding:6px}
.pal .grp{font-size:12px;color:var(--ink-3);padding:8px 12px 3px}
.pal .ri{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:6px;cursor:pointer}
.pal .ri.on{background:var(--grid-soft)}
.pal .ri small{color:var(--ink-3);margin-left:auto;white-space:nowrap}
#toasts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:7px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.toast.err{background:var(--alert);color:#fff}
.side-scrim{display:none}

@media (max-width:1100px){.grid3{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;top:0;bottom:0;left:0;width:264px;z-index:45;transform:translateX(-100%);transition:transform .2s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .side.open{transform:none}
  .side-scrim.open{display:block;position:fixed;inset:0;background:rgba(8,20,30,.4);z-index:44}
  .menu-btn{display:grid}
  .grid2,.grid3,.grid2e{grid-template-columns:1fr}
  main{padding:16px 14px 64px}
  .top{padding:8px 10px}
  .searchbtn kbd{display:none}
  .phead h1{font-size:27px}
  .fg{grid-template-columns:1fr}
  .kv{grid-template-columns:120px 1fr}
  .hbar{grid-template-columns:100px 1fr 90px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================= utilities ================= */

const sum=(a,f=x=>x)=>a.reduce((s,x)=>s+(+f(x)||0),0);

bolt:'<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>',refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>'};
const ic=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const LOGO=`<svg width="54" height="36" viewBox="0 0 120 80" aria-hidden="true"><defs><linearGradient id="lgS" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#C9CCCF"/><stop offset="1" stop-color="#8E9398"/></linearGradient><linearGradient id="lgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A6D160"/><stop offset="1" stop-color="#4B8A26"/></linearGradient></defs><g stroke="#3B3F43" stroke-width=".8" stroke-linejoin="round"><path d="M8,8H27L63,76H44Z" fill="url(#lgS)"/><path d="M18.6,22H22V69Q23,75 29,76H11Q17.6,75 18.6,69Z" fill="url(#lgS)"/><path d="M68.5,20.5L71,21.5 53,74 50.5,73Z" fill="url(#lgS)"/><path d="M70,9C97,4 110,18 101,32C96,40 87,44 74,46C84,40 90,33 89,24C88,15 81,11 70,9Z" fill="url(#lgG)"/><path d="M74,45C87,45 93,55 100,66C104,73 108,76 117,78H104C97,76 93,70 88,62C84,55 80,50 74,48Z" fill="url(#lgG)"/></g></svg>`;

/* rows copied from MASS_RENEWABLE_ENERGY_SOLUTIONS (1).xlsx: ITEM MASTER LIST, SALES ORDERS, Form responses */
const WB_RAW=null;
const WB_NAME="MASS_RENEWABLE_ENERGY_SOLUTIONS (1).xlsx";
/* ================= domain ================= */
const ORDER_FLOW=['New','Waiting on parts','Ready to pick','Packed','Shipped','Invoiced','Completed'];
const WHO={New:'you','Waiting on parts':'vendor','Partially shipped':'vendor','Ready to pick':'you',Packed:'you',Shipped:'you',Invoiced:'customer',Completed:'done'};
const WAREHOUSES=['Main warehouse'];
const USER={name:'Satish',initials:'S'};
const TEAM=['Satish','Sales','Purchasing','Warehouse','Accounting'];
const VENDOR_ALIASES=[['Harrington Industrial',/harr?ing?ton|herrington/i],['Hi-Tech Machining',/hi-?\s?tech/i],['Stockton Industrial',/stockton/i],['Smartricity',/smar?t?ricity|smarricity/i],['Titan Fittings',/titan/i],['McMaster-Carr',/mcmaster/i],['Grainger',/grainger/i],['Applied Industrial',/applied/i],['WEG',/\bweg\b/i],['Finish Thompson',/finish thompson/i],['Cannon Gasket',/cannon/i],['Transducers Direct',/transducers/i],['HYDAC',/hydac/i],['Dellner Wind Solutions',/dellner/i],['Amazon',/amazon/i],['Zoro',/zoro/i],['Horace',/\bhorace\b/i]];

const clean=v=>v==null?'':String(v).replace(/[\u2000-\u200B\u00A0\u2011]/g,m=>m==='\u2011'?'-':' ').replace(/\s+/g,' ').trim();
const numv=v=>{if(v==null||v==='')return null;if(typeof v==='number')return v;const m=String(v).replace(/[$,]/g,'').match(/-?\d+(\.\d+)?/);return m?+m[0]:null};
const xlDate=n=>typeof n==='number'&&n>30000&&n<80000?iso(new Date(1899,11,30+n)):null;
const txtDate=s=>{const m=clean(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(!m)return null;const y=+m[3]<100?2000+ +m[3]:+m[3];return iso(new Date(y,+m[1]-1,+m[2]))};
const title=s=>clean(s).toLowerCase().replace(/(^|[\s(/-])([a-z])/g,(a,b,c)=>b+c.toUpperCase()).replace(/\bLlc\b/g,'LLC').replace(/\bDwt\b/g,'DWT');
const vendorOf=t=>{const s=clean(t);if(!s)return null;for(const [n,re] of VENDOR_ALIASES)if(re.test(s))return n;return null};
const custOf=t=>{const s=clean(t);for(const [n,re] of CUSTOMER_ALIASES)if(re.test(s))return n;return /^mass\b/i.test(s)?null:title(s)};
const leadDays=t=>{const s=clean(t).toLowerCase(),n=numv(s);if(n==null)return null;return /week/.test(s)?n*7:/month/.test(s)?n*30:n};

function importWorkbook(raw,fileName){
 const issues=[],add=(sev,area,text,ref)=>issues.push({sev,area,text,ref});
 const vendors=new Map(),V=n=>{if(!n)return null;if(!vendors.has(n))vendors.set(n,{id:'V-'+(vendors.size+11),name:n,lead:null,contact:'',email:'',phone:''});return vendors.get(n).id};
 const customers=new Map(),C=n=>{if(!customers.has(n))customers.set(n,{id:'C-'+(customers.size+101),name:n,contact:'',email:'',phone:'',terms:'Net 30',shipTos:[]});return customers.get(n).id};
 /* ---- item master ---- */
 const items=[],bySku=new Map(),asm=new Map();
 const hdr=raw.items[0].map(h=>clean(h).toLowerCase());
 const col=k=>hdr.findIndex(h=>h.startsWith(k));
 const ci={sku:col('sku'),name:col('part name'),desc:col('description'),cat:col('category'),type:col('type'),vendor:col('vendor'),cost:col('cost'),price:col('price'),lead:col('lead'),min:col('min'),max:col('max'),qoh:col('current qoh'),loc:col('location'),used:col('notes'),moq:col('moq'),url:col('more notes'),per:col('# need')};
 raw.items.slice(1).forEach((r,ri)=>{
  const sku=clean(r[ci.sku]);if(!sku)return;const g=k=>ci[k]>=0?r[ci[k]]:null;
  const used=clean(g('used')),per=numv(g('per')),labels=used?used.split(/\s+(?:&|and)\s+/i).map(clean).filter(Boolean):[];
  let it=bySku.get(sku.toUpperCase());
  if(it){if(!it.flags.includes('Listed twice in the item master'))it.flags.push('Listed twice in the item master');add('warn','Items',`${sku} appears more than once in the item master`,sku)}
  else{const vn=vendorOf(g('vendor'))||(clean(g('vendor'))?title(g('vendor')):null);const u=clean(g('url'));
   it={sku,id:sku,name:clean(g('name'))||clean(g('desc')),desc:clean(g('desc')),cat:clean(g('cat'))||'Uncategorized',type:clean(g('type'))||'Inventory',vendor:V(vn),cost:numv(g('cost')),price:numv(g('price')),lead:numv(g('lead')),min:numv(g('min'))||0,max:numv(g('max'))||0,onhand:numv(g('qoh'))||0,alloc:0,loc:clean(g('loc')),moq:numv(g('moq')),url:/^https?:/.test(u)?u:'',usedIn:[],flags:[],row:ri+2};

 New:'alert','Ready to pick':'alert',Packed:'alert',Shipped:'info','Waiting on parts':'warn','Partially shipped':'warn','Partially received':'warn',Negotiation:'warn',

/* ================= charts ================= */
function barChart(labels,series,{h=210,fmt=$c}={}){
 const W=640,H=h,L=52,Rr=6,T=10,B=24,iw=W-L-Rr,ih=H-T-B;const mx=Math.max(...series.flatMap(s=>s.vals))*1.1||1;const gw=iw/labels.length,bw=Math.min(28,(gw-8)/series.length);
 let g='';for(let k=0;k<=4;k++){const v=mx*k/4,yy=T+ih-ih*k/4;g+=`<line x1="${L}" x2="${W-Rr}" y1="${yy}" y2="${yy}" style="stroke:var(--line)"/><text x="${L-8}" y="${yy+4}" text-anchor="end" font-size="11" style="fill:var(--ink-3)">${fmt(v)}</text>`}
 const bars=labels.map((lb,i)=>{const cx=L+gw*i+gw/2,x0=cx-bw*series.length/2;return series.map((s,j)=>{const v=Math.max(0,s.vals[i]),bh=v/mx*ih;return `<rect x="${x0+j*bw+1}" y="${T+ih-bh}" width="${bw-2}" height="${bh}" rx="2" style="fill:${s.color}"><title>${esc(lb)}: ${esc(s.name)} ${$f(v)}</title></rect>`}).join('')+`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="11" style="fill:var(--ink-3)">${esc(lb)}</text>`}).join('');
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(series.map(s=>s.name).join(' and '))} by month">${g}${bars}</svg>`}
function rail(steps,cur,sub){return `<div class="rail-wrap"><div class="rail" style="grid-template-columns:repeat(${steps.length},minmax(104px,1fr));min-width:${steps.length*104}px" role="list">${steps.map((s,i)=>{const cls=i<cur?'done':i===cur?'cur':'';return `<div class="rnode ${cls}" role="listitem" ${i===cur?'aria-current="step"':''}><span class="dot">${i<cur?ic('check',13):''}</span>${s}<span class="d">${sub[i]||''}</span></div>`}).join('')}</div></div>`}
function months(n=6){const out=[];for(let i=n-1;i>=0;i--){const d=new Date(T0.getFullYear(),T0.getMonth()-i,1),k=iso(d).slice(0,7);const os=S.orders.filter(o=>(o.date||'').slice(0,7)===k);out.push({m:iso(d),rev:sum(os,oRev),cost:sum(os,oCost)})}return out}

 else if(cur==='Stock count'){const its=S.items.filter(i=>i.type!=='Non-inventory');b=`<p class="muted" style="margin-top:0;max-width:85ch">The workbook's Current QOH column was blank. Count the shelf, type the quantities, and save. Every change is logged as an inventory adjustment, and any order whose parts are now on hand moves to the pick list.</p><div class="toolbar">${searchBox('cnt','Filter by SKU or name')}<span class="grow"></span>${btn(ic('check',15)+' Save count','save-count',{},'primary')}</div>

 else{const pl=plan();b=`<section class="panel mb"><div class="pb"><p style="margin:0;max-width:85ch">Parts ordered three or more times since May. Suggested minimum covers demand during the lead time you quote customers plus a 50% buffer; the maximum adds about two months of sales. Bushings are quoted at 12 weeks today, so stocking them is the biggest lever for faster delivery.</p><div class="toolbar" style="margin:10px 0 0"><label class="check-inline">Budget <input class="input" type="number" step="5000" min="0" value="${ui.budget}" data-set="budget" style="width:130px"></label><span class="muted sm">${pl.filter(x=>x.inBudget).length} of ${pl.length} parts fit, ${$f(sum(pl.filter(x=>x.inBudget),x=>x.inv))}</span><span class="grow"></span>${btn('Apply min and max','plan-apply',{},'sm')}${btn(ic('truck',15)+' Draft stock POs within budget','plan-po',{},'sm primary')}</div></div></section>

function demand(it){const ls=S.orders.filter(o=>o.date&&dd(o.date)>=-365).flatMap(o=>o.lines.filter(l=>l.sku===it.sku).map(l=>({...l,acct:o.acct,date:o.date})));
 const units=sum(ls,l=>l.qty),orders=ls.length,first=ls.map(l=>l.date).sort()[0];const span=first?Math.max(1,-dd(first)/30):12;const mo=units/span;const lead=it.lead||21;const rep=orders>=3;

function detectItems(text){const out=[];const up=text.toUpperCase();
 S.items.forEach(it=>{const i=up.indexOf(it.sku);if(i<0)return;const before=text.slice(Math.max(0,i-90),i);let q=1;const re=/(\d[\d,]*)(?![\d,])(?!\s*(?:kW|W\b|A\b|V\b|MVA|MWh|MW|kV|m\b|%|-|ft|sq|mm|hour|day|week))/g;let mm;while((mm=re.exec(before)))q=+mm[1].replace(/,/g,'')||1;out.push({sku:it.sku,qty:q})});return out}

let onSubmit=null,lastFocus=null;
function modal(title,body,{submit,label='Save',wide=false,foot=''}={}){
 lastFocus=document.activeElement;onSubmit=submit||null;
 $('#modal-root').innerHTML=`<div class="scrim" data-action="close-modal"></div><form class="modal ${wide?'wide':''}" id="mform" role="dialog" aria-modal="true" aria-label="${esc(title)}" novalidate><header><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-action="close-modal" aria-label="Close">${ic('x')}</button></header><div class="mbody">${body}</div>${submit||foot?`<footer>${foot}${submit?`<button type="button" class="btn ghost" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">${label}</button>`:''}</footer>`:''}</form>`;
 const f=$('#mform input:not([type=hidden]):not([type=checkbox]),#mform select,#mform textarea');(f||$('#mform button')).focus();if($('#qtotal'))recalc($('#mform'))}
function closeModal(){$('#modal-root').innerHTML='';onSubmit=null;if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),err?4800:3200)}
function fail(m){toast(m,true);return false}
const opt=(v,l,sel)=>`<option value="${esc(v)}" ${sel?'selected':''}>${esc(l)}</option>`;
const fld=(label,inner,full)=>`<label class="f ${full?'full':''}">${label}${inner}</label>`;
const inp=(name,val='',extra='')=>`<input class="input" name="${name}" value="${esc(val??'')}" ${extra}>`;
const itemOpts=sel=>S.items.map(i=>opt(i.sku,`${i.sku}, ${i.desc||i.name}`,i.sku===sel)).join('');
const costOf=sku=>{const it=item(sku);if(!it)return 0;if(it.cost!=null)return it.cost;const a=asmOf(sku);return a?buildCost(a).total:0};
function itemFlags(i){const keep=i.flags.filter(f=>/duplicate|twice|filled|Added/.test(f));const isComp=S.assemblies.some(a=>a.comps.some(c=>c.sku===i.sku));if(i.type!=='Non-inventory'&&i.cost==null)keep.push('No cost');if(!i.vendor&&i.type!=='Non-inventory'&&!i.assembly)keep.push('No vendor');if(!isComp&&i.price==null)keep.push('No sell price');i.flags=keep}

/* line builders */
function sellRow(sku,q=1,price){const it=item(sku)||S.items[0];return `<tr class="qline" data-kind="sell"><td style="min-width:240px"><select name="sku" aria-label="Part">${itemOpts(it.sku)}</select></td><td style="width:90px"><input class="input" name="qty" type="number" min="1" value="${q}" aria-label="Quantity"></td><td style="width:120px"><input class="input" name="price" type="number" min="0" step="0.01" value="${price??it.price??''}" aria-label="Unit price"></td><td class="n sm mg"></td><td class="n lt"></td><td><button type="button" class="icon-btn" data-action="rm-line" aria-label="Remove line">${ic('x',15)}</button></td></tr>`}
function poRow(sku,q=1){const it=item(sku)||S.items[0];return `<tr class="qline" data-kind="po"><td style="width:55%"><select name="sku" aria-label="Part">${itemOpts(it.sku)}</select></td><td><input class="input" name="qty" type="number" min="1" value="${q}" aria-label="Quantity"></td><td><input class="input" name="price" type="number" min="0" step="0.01" value="${it.cost??''}" aria-label="Unit cost"></td><td class="n lt"></td><td><button type="button" class="icon-btn" data-action="rm-line" aria-label="Remove line">${ic('x',15)}</button></td></tr>`}
function linesBlock(kind,lines){const rows=lines&&lines.length?lines:[{sku:S.items.find(i=>i.price)?.sku||S.items[0].sku,qty:1}];return `<div class="f full">Line items<div class="tbl-wrap"><table class="lines"><thead><tr>${kind==='sell'?'<th>Part</th><th>Qty</th><th>Unit price</th><th class="n">Margin</th><th class="n">Line total</th><th></th>':'<th>Part</th><th>Qty</th><th>Unit cost</th><th class="n">Line total</th><th></th>'}</tr></thead><tbody data-kind="${kind}">${rows.map(l=>kind==='sell'?sellRow(l.sku,l.qty,l.price):poRow(l.sku,l.qty)).join('')}</tbody></table></div><div><button type="button" class="btn sm" data-action="add-line" data-kind="${kind}">${ic('plus',14)} Add line</button></div></div>`}
function readSell(f){return $$('.qline[data-kind=sell]',f).map(r=>{const sku=$('[name=sku]',r).value;return{sku,qty:+$('[name=qty]',r).value||0,price:+$('[name=price]',r).value||0,cost:costOf(sku),shipped:0,fulfil:asmOf(sku)?'Build':'Buy-in',vendor:item(sku).vendor}}).filter(l=>l.qty>0)}
function readPO(f){return $$('.qline[data-kind=po]',f).map(r=>({sku:$('[name=sku]',r).value,qty:+$('[name=qty]',r).value||0,cost:+$('[name=price]',r).value||0,received:0})).filter(l=>l.qty>0)}
function recalc(f){if(!f)return;let t=0,c=0;$$('.qline',f).forEach(r=>{const q=+$('[name=qty]',r).value||0,p=+$('[name=price]',r).value||0;t+=q*p;$('.lt',r).textContent=$f(q*p);if(r.dataset.kind==='sell'){const sku=$('[name=sku]',r).value,co=costOf(sku),it=item(sku);c+=q*co;$('.mg',r).innerHTML=co?`${pctTxt(gmPct(p,co))}`+(avail(it)<q?`<div class="muted">${num(Math.max(0,avail(it)))} in stock</div>`:''):'<span class="muted">No cost</span>'}});const o=$('#qtotal',f);if(o)o.textContent=$f(t);const m=$('#qmargin',f);if(m)m.textContent=c&&t?pctTxt(gmPct(t,c))+' margin':''}

M.newPart=()=>modal('Add part',`<div class="fg">${fld('SKU',inp('sku','','required'))}${fld('Part name',inp('name','','required'))}${fld('Description',inp('desc'),true)}${fld('Category',inp('cat','','list="cats2"'))}<datalist id="cats2">${[...new Set(S.items.map(i=>i.cat))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>${fld('Vendor',`<select name="vendor"><option value="">None</option>${S.vendors.map(v=>opt(v.id,v.name)).join('')}</select>`)}${fld('Cost',inp('cost','','type="number" min="0" step="0.01"'))}${fld('Sell price',inp('price','','type="number" min="0" step="0.01"'))}${fld('Lead time (days)',inp('lead','','type="number" min="0"'))}${fld('MOQ',inp('moq','','type="number" min="0"'))}</div>`,{wide:true,label:'Add part',submit:d=>{const sku=d.sku.trim();if(!sku||!d.name.trim())return fail('Add a SKU and part name.');if(item(sku))return fail(`${sku} already exists.`);const it={sku,id:sku,name:d.name.trim(),desc:d.desc||d.name.trim(),cat:d.cat||'Uncategorized',type:'Inventory',vendor:d.vendor||null,cost:d.cost===''?null:+d.cost,price:d.price===''?null:+d.price,lead:+d.lead||null,min:0,max:0,onhand:0,alloc:0,loc:'',moq:+d.moq||null,url:'',usedIn:[],flags:[],row:null};it.src=it.vendor?[{v:it.vendor,cost:it.cost??0,lead:it.lead||21,mpn:sku}]:[];itemFlags(it);S.items.push(it);log(`Added part ${sku}`);toast(`${sku} added`)}});
M.pick=id=>{const o=byId(S.orders,id);modal(`Pick and pack ${oLabel(o)}`,`${table('pk',['Part','Location','#Qty'],o.lines.filter(l=>rem(l)>0).map(l=>`<tr><td><b>${esc(l.sku)}</b><div class="muted sm">${esc(item(l.sku)?.desc||'')}</div></td><td>${esc(item(l.sku)?.loc||'–')}</td><td class="n">${num(rem(l))}</td></tr>`))}<div class="fg" style="margin-top:14px">${fld('Picked by',`<select name="by">${TEAM.map(t=>opt(t,t)).join('')}</select>`)}${fld('Boxes',inp('boxes',1,'type="number" min="1"'))}${fld('Weight (lb)',inp('weight','','type="number" min="0" step="0.1"'))}${fld('Issues',inp('issues','','placeholder="Optional"'))}</div>`,{label:'Mark packed',submit:d=>{o.pack={by:d.by,boxes:+d.boxes||1,weight:+d.weight||null,issues:d.issues,date:TODAY};const was=o.status;o.status='Packed';o.dates.Packed=TODAY;log(`Picked and packed ${oLabel(o)} (${d.by})${d.issues?': '+d.issues:''}`,[...stCh(was,'Packed'),{f:'Boxes',from:'blank',to:fmtV(o.pack.boxes)},...(o.pack.weight?[{f:'Weight (lb)',from:'blank',to:fmtV(o.pack.weight)}]:[])]);toast(`${oLabel(o)} packed`)}})};
M.ship=id=>{const o=byId(S.orders,id);modal(`Ship ${oLabel(o)}`,`<p class="muted" style="margin-top:0">To ${esc(aname(o.acct))}${o.shipTo?', '+esc(o.shipTo):''}. Ship fewer than ordered to leave the rest on backorder.</p><div class="fg">${o.lines.filter(l=>rem(l)>0).map((l,i)=>fld(`${esc(l.sku)}, ${num(rem(l))} to ship`,inp('q'+o.lines.indexOf(l),rem(l),`type="number" min="0" max="${rem(l)}"`))).join('')}${fld('Ship method',`<select name="carrier">${['Courier to Thousand Palms','Will call','UPS','FedEx','LTL freight','Drop ship from vendor'].map(c=>opt(c,c)).join('')}</select>`)}${fld('Tracking #',inp('tracking'))}${fld('Ship date',inp('date',TODAY,'type="date"'))}${fld('Shipped by',`<select name="by">${TEAM.map(t=>opt(t,t)).join('')}</select>`)}</div>`,{label:'Ship',submit:d=>{let any=0,val=0;const was=o.status,ch=[];
  o.lines.forEach((l,i)=>{if(d['q'+i]==null)return;const q=Math.min(rem(l),Math.max(0,+d['q'+i]||0));const it=item(l.sku);if(q>it.onhand){any=-1;return}if(!q)return;ch.push({f:`${l.sku} delivered`,from:fmtV(l.shipped),to:fmtV(l.shipped+q)},{f:`${l.sku} on hand`,from:fmtV(it.onhand),to:fmtV(it.onhand-q)});it.onhand-=q;it.alloc=Math.max(0,it.alloc-q);l.shipped+=q;any+=q;val+=q*l.price;S.shipments.push({order:o.id,sku:l.sku,qty:q,date:d.date||TODAY,carrier:d.carrier,tracking:d.tracking,by:d.by,boxes:o.pack?.boxes,weight:o.pack?.weight,value:q*l.price})});
  if(any<0)return fail('You can’t ship more than is on hand.');if(!any)return fail('Enter a quantity to ship.');
  o.shipMethod=d.carrier;o.tracking=d.tracking||o.tracking;const left=sum(o.lines,rem);
  if(left>0){o.lines.forEach(l=>{const r=rem(l);if(r>0)item(l.sku).alloc=Math.max(0,item(l.sku).alloc-r)});o.status='Partially shipped';o.dates['Partially shipped']=d.date||TODAY}else{o.status='Shipped';o.dates.Shipped=d.date||TODAY}
  log(`Shipped ${num(any)} units on ${oLabel(o)} via ${d.carrier}${d.tracking?' ('+d.tracking+')':''}${left?`, ${num(left)} on backorder`:''}`,[...stCh(was,o.status),...ch,...(d.tracking?[{f:'Tracking #',from:'blank',to:d.tracking}]:[])]);checkReady();toast(left?`Shipped. ${num(left)} left on backorder.`:`${oLabel(o)} shipped`)}})};
M.invoice=id=>{const o=byId(S.orders,id);const n=nextNum(S.invoices,i=>+i.id,1000);modal(`Invoice ${oLabel(o)}`,`<p class="muted" style="margin-top:0">Use the invoice number from QuickBooks Online so the two match.</p><div class="fg">${fld('Invoice #',inp('num',n))}${fld('Invoice date',inp('date',TODAY,'type="date"'))}${fld('Amount',inp('amt',Math.round(sum(o.lines,l=>l.shipped*l.price)*100)/100,'type="number" step="0.01"'))}${fld('Terms (days)',inp('terms',30,'type="number"'))}</div>`,{label:'Create invoice',submit:d=>{if(!d.num.trim())return fail('Add the invoice number.');if(S.invoices.some(i=>i.id===d.num.trim()))return fail(`Invoice ${d.num} already exists.`);S.invoices.push({id:d.num.trim(),acct:o.acct,ref:o.id,issued:d.date,due:iso(addDays(pd(d.date),+d.terms||30)),amount:+d.amt,paid:0,paidOn:null});const was=o.status;o.invoice=d.num.trim();o.status='Invoiced';o.dates.Invoiced=d.date;log(`Invoiced ${oLabel(o)} as ${d.num}`,[...stCh(was,'Invoiced'),{f:'Invoice #',from:'blank',to:d.num.trim()},{f:'Amount',from:'blank',to:$f(+d.amt)}]);toast(`Invoice ${d.num} created`)}})};
M.invNumber=id=>{const i=byId(S.invoices,id);modal('Add invoice number',`<p class="muted" style="margin-top:0">Order ${esc(i.ref)} was marked invoiced in the workbook without a number. Enter the QuickBooks invoice number.</p>${fld('Invoice #',inp('num',''))}`,{label:'Save',submit:d=>{const n=d.num.trim();if(!n)return fail('Enter a number.');if(S.invoices.some(x=>x.id===n))return fail(`Invoice ${n} already exists.`);const o=byId(S.orders,i.ref);i.id=n;delete i.missing;if(o){o.invoice=n;o.flags=o.flags.filter(f=>!/no invoice number/.test(f))}S.issues=S.issues.filter(x=>!(x.ref===i.ref&&/no invoice number/.test(x.text)));log(`Set invoice number ${n} on ${i.ref}`,[{f:'Invoice #',from:'blank',to:n}]);toast('Invoice number saved')}})};
M.receive=id=>{const p=byId(S.pos,id);modal(`Receive ${p.id} from ${vend(p.vendor).name}`,`${p.recon?`<p class="note">${ic('alert',14)} This PO was set up from a note on the sales order sheet: “${esc(p.note)}”. Enter what actually arrived.</p>`:''}<div class="fg">${p.lines.map((l,i)=>fld(`${esc(l.sku)}, ${num(l.qty-(l.received||0))} still due`,inp('q'+i,l.qty-(l.received||0),'type="number" min="0"'))).join('')}${fld('Condition',`<select name="cond">${['Good','Damaged','Wrong part'].map(c=>opt(c,c)).join('')}</select>`)}${fld('Put away to',inp('loc',item(p.lines[0].sku)?.loc||'','placeholder="Bin or shelf"'))}${fld('Received by',`<select name="by">${TEAM.map(t=>opt(t,t)).join('')}</select>`)}${fld('Received date',inp('date',TODAY,'type="date"'))}</div>`,{label:'Receive',submit:d=>{let tot=0;const ch=[],wasP=p.status;
  p.lines.forEach((l,i)=>{const q=Math.max(0,+d['q'+i]||0);if(!q)return;ch.push({f:`${l.sku} received`,from:fmtV(l.received||0),to:fmtV((l.received||0)+q)});l.received=(l.received||0)+q;tot+=q;const it=item(l.sku);if(d.cond==='Good'){ch.push({f:`${l.sku} on hand`,from:fmtV(it.onhand),to:fmtV(it.onhand+q)});it.onhand+=q;if(d.loc&&!it.loc)it.loc=d.loc}S.receiving.push({po:p.id,sku:l.sku,qty:q,cond:d.cond,loc:d.loc,by:d.by,date:d.date||TODAY})});
  if(!tot)return fail('Enter a quantity received.');p.status=p.lines.every(l=>(l.received||0)>=l.qty)?'Received':'Partially received';p.received=d.date||TODAY;
  const amt=Math.round(sum(p.lines,l=>(l.received||0)*(l.cost||0)));if(amt)S.bills.push({id:nextId(S.bills,'BILL-')||'BILL-1',vendor:p.vendor,ref:p.id,issued:TODAY,due:iso(addDays(T0,30)),amount:amt,paid:0,paidOn:null});
  log(`Received ${num(tot)} units on ${p.id} from ${vend(p.vendor).name} (${d.cond})`,[...stCh(wasP,p.status),...ch]);const mv=checkReady();toast(mv.length?`Received. ${mv.length} order${mv.length>1?'s':''} moved to the pick list.`:`${p.id} received`)}})};
M.build=id=>{const a=S.assemblies.find(x=>x.id===id);const cb=canBuild(a);modal(`Record a build: ${a.id}`,`<p class="muted" style="margin-top:0">${a.finished?`Adds finished ${esc(a.finished)} to stock and`:'This build has no finished part in the item master, so this only'} uses up the components below. You have parts for ${cb} right now.</p>${fld('How many built',inp('n',Math.max(1,cb),'type="number" min="1"'))}${table('bb',['Component','#Per build','#On hand'],a.comps.map(c=>`<tr><td>${esc(c.sku)}</td><td class="n">${num(c.qty)}</td><td class="n">${num(item(c.sku)?.onhand||0)}</td></tr>`))}`,{label:'Record build',submit:d=>{const n=+d.n||0;if(n<1)return fail('Enter how many were built.');const short=a.comps.filter(c=>avail(item(c.sku))<c.qty*n);if(short.length)return fail(`Not enough on the shelf: ${short.map(c=>c.sku).join(', ')}. Receive or count stock first.`);
  const ch=[];a.comps.forEach(c=>{const it=item(c.sku);ch.push({f:`${c.sku} on hand`,from:fmtV(it.onhand),to:fmtV(it.onhand-c.qty*n)});it.onhand-=c.qty*n;S.adjustments.push({date:TODAY,sku:c.sku,qty:-c.qty*n,reason:'Used in build',by:USER.name,note:a.id})});if(a.finished){ch.unshift({f:`${a.finished} on hand`,from:fmtV(item(a.finished).onhand),to:fmtV(item(a.finished).onhand+n)});item(a.finished).onhand+=n;S.adjustments.push({date:TODAY,sku:a.finished,qty:n,reason:'Built',by:USER.name,note:a.id})}
  S.builds.push({asm:a.id,n,date:TODAY,by:USER.name});log(`Built ${n} × ${a.id}`,ch);const mv=checkReady();toast(`Recorded ${n} built${mv.length?`, ${mv.length} order${mv.length>1?'s':''} ready to pick`:''}`)}})};
M.buildPO=id=>{const a=S.assemblies.find(x=>x.id===id);const openQty=sum(S.orders.filter(o=>['New','Waiting on parts','Partially shipped'].includes(o.status)).flatMap(o=>o.lines).filter(l=>l.sku===a.finished),rem);
 modal(`Order parts for ${a.id}`,`<p class="muted" style="margin-top:0">Draft POs are grouped by vendor and rounded up to each part's MOQ. Parts already on the shelf or on an open PO are subtracted.${openQty?` Open orders need ${num(openQty)}.`:''}</p>${fld('Number of builds',inp('n',openQty||10,'type="number" min="1"'))}`,{label:'Draft POs',submit:d=>{const n=+d.n||0;if(n<1)return fail('Enter a number of builds.');const needs=a.comps.map(c=>{const it=item(c.sku);return{sku:c.sku,gap:Math.max(0,c.qty*n-Math.max(0,avail(it))-onPO(c.sku)-onDraft(c.sku))}}).filter(x=>x.gap>0);const r=draftPOs(needs,`${n} × ${a.id}`);if(r===false)return false}})};
function draftPOs(needs,forTxt){const g={},skip=[];needs.forEach(x=>{const it=item(x.sku);if(!it||!it.vendor){skip.push(x.sku);return}const q=Math.max(x.gap,it.moq||0);(g[it.vendor]=g[it.vendor]||[]).push({sku:x.sku,qty:q,cost:it.cost??0,received:0})});
 const made=Object.entries(g).map(([v,lines])=>{const id=nextId(S.pos,'PO-');S.pos.push({id,vendor:v,type:'Order',date:TODAY,exp:null,lines,status:'Draft',forOrders:forTxt});return id});
 if(!made.length){toast(skip.length?`Nothing drafted. These parts need a vendor first: ${skip.join(', ')}`:'Nothing to order, everything is covered.',!!skip.length);return !skip.length&&undefined}
 log(`Drafted ${made.join(', ')} for ${forTxt}`);toast(`Drafted ${made.length} PO${made.length>1?'s':''}${skip.length?`. No vendor on file for ${skip.join(', ')}`:''}. Review and send them.`,!!skip.length);ui.tabs.purchasing='Purchase orders';return true}
M.emNew=()=>modal('Log a call or email',`<div class="fg">${fld('Came in by',`<select name="channel">${['Phone','Email','Web form'].map(c=>opt(c,c)).join('')}</select>`)}${fld('Category',`<select name="cat">${EM_CATS.map(c=>opt(c,c)).join('')}</select>`)}${fld('Contact',inp('fromName','','required'))}${fld('Email or phone',inp('from'))}${fld('Customer',`<select name="acct"><option value="">Not a customer yet</option>${S.accounts.map(a=>opt(a.id,a.name)).join('')}</select>`)}${fld('Company (if new)',inp('company'))}${fld('Subject',inp('subject','','required'),true)}${fld('What they asked for','<textarea name="body" required placeholder="Write part numbers and quantities if they gave them. The inbox picks them up."></textarea>',true)}${fld('Owner',`<select name="owner"><option value="">Unassigned</option>${TEAM.map(o=>opt(o,o,o===USER.name)).join('')}</select>`)}</div>`,{label:'Log it',submit:d=>{if(!d.fromName.trim()||!d.subject.trim()||!d.body.trim())return fail('Add a contact, subject and what they asked for.');const id=nextId(S.emails,'EM-'),t=new Date().toISOString();S.emails.push({id,channel:d.channel,received:t,fromName:d.fromName.trim(),from:d.from||'',company:d.acct?aname(d.acct):(d.company||d.fromName).trim(),acct:d.acct||null,subject:d.subject.trim(),cat:d.cat,status:d.owner?'Open':'New',owner:d.owner||null,links:[],read:true,thread:[{dir:'in',by:d.fromName.trim(),t,body:d.body.trim()}]});log(`Logged ${d.channel.toLowerCase()} ${id} from ${d.fromName.trim()}`);toast(`${id} logged`);ui.emF='All';setTimeout(()=>location.hash='#/inbox/'+id,0)}});
M.emLink=id=>{const em=byId(S.emails,id);const g=(label,arr,t,f)=>`<optgroup label="${label}">${arr.map(x=>opt(t+'|'+x.id,f(x))).join('')}</optgroup>`;modal('Link an existing record',`${fld('Record',`<select name="rec">${g('Sales orders',S.orders.slice().reverse(),'order',x=>`${oLabel(x)}, PO ${x.cpo}, ${aname(x.acct)}, ${x.status}`)}${g('Quotes',S.quotes.slice().reverse(),'quote',x=>`${x.id}, ${aname(x.acct)}, ${x.status}`)}${g('Vendor POs',S.pos.slice().reverse(),'po',x=>`${x.id}, ${vend(x.vendor).name}, ${x.status}`)}</select>`,true)}`,{label:'Link record',submit:d=>{const i=d.rec.indexOf('|');linkEmail(em,d.rec.slice(0,i),d.rec.slice(i+1));toast('Linked')}})};

A['add-line']=d=>{const tb=$(`#mform tbody[data-kind="${d.kind}"]`);tb.insertAdjacentHTML('beforeend',d.kind==='sell'?sellRow(S.items.find(i=>i.price)?.sku||S.items[0].sku):poRow(S.items[0].sku));recalc($('#mform'))};
A['rm-line']=(d,el)=>{const tb=el.closest('tbody');if($$('.qline',tb).length>1){el.closest('tr').remove();recalc($('#mform'))}};
A['so-po']=d=>{const o=byId(S.orders,d.id);const skus=new Set(o.lines.flatMap(l=>{const a=asmOf(l.sku);return a?[l.sku,...a.comps.map(c=>c.sku)]:[l.sku]}));const needs=supplyDemand().filter(r=>skus.has(r.sku)&&r.gap>0).map(r=>({sku:r.sku,gap:Math.max(0,r.gap-r.draft)})).filter(r=>r.gap>0);
 if(!needs.length){const was=o.status;o.status='Waiting on parts';o.dates['Waiting on parts']=TODAY;log(`${oLabel(o)} is covered by open vendor POs`,stCh(was,o.status));toast('Already covered by open vendor POs. Marked waiting on parts.');save();rerender();return}
 const r=draftPOs(needs,oLabel(o));if(r){const was=o.status;o.status='Waiting on parts';o.dates['Waiting on parts']=TODAY;log(`${oLabel(o)} is waiting on the drafted POs`,stCh(was,o.status))}save();rerender()};
A['order-gaps']=d=>{const needs=supplyDemand().filter(r=>r.gap>0&&(!d.sku||r.sku===d.sku)).map(r=>({sku:r.sku,gap:Math.max(0,r.gap-r.draft)})).filter(r=>r.gap>0);if(!needs.length)return toast('Drafts already cover these shortages. Send them from Purchase orders.');draftPOs(needs,d.sku?'shortage':'open-order shortages');save();rerender()};
A['po-send']=d=>{const p=byId(S.pos,d.id);p.status='Sent';p.date=TODAY;const ld=Math.max(...p.lines.map(l=>item(l.sku)?.lead||vend(p.vendor).lead||21));p.exp=iso(addDays(T0,ld));const moved=S.orders.filter(o=>o.status==='New'&&o.lines.some(l=>p.lines.some(x=>x.sku===l.sku)||asmOf(l.sku)?.comps.some(c=>p.lines.some(x=>x.sku===c.sku))));moved.forEach(o=>{o.status='Waiting on parts';o.dates['Waiting on parts']=TODAY});log(`Sent ${p.id} to ${vend(p.vendor).name}`,[...stCh('Draft','Sent'),{f:'Expected date',from:'blank',to:fds(p.exp)},...moved.map(o=>({f:`${oLabel(o)} status`,from:'New',to:'Waiting on parts'}))]);toast(`${p.id} sent, expected ${fd(p.exp)}`);save();rerender()};
A['quote-send']=d=>{const q=byId(S.quotes,d.id);q.status='Sent';log(`Sent quote ${q.id}`,stCh('Draft','Sent'));save();rerender()};
A['quote-lost']=d=>{const q=byId(S.quotes,d.id);const was=q.status;q.status='Lost';log(`Marked quote ${q.id} lost`,stCh(was,'Lost'));save();rerender()};

function parseBankCSV(text){const out=[];text.split(/\r?\n/).forEach(line=>{const s=line.trim();if(!s)return;const cells=[];let cur='',q=false;for(const ch of s){if(ch==='"'){q=!q;continue}if((ch===','||ch==='\t')&&!q){cells.push(cur.trim());cur='';continue}cur+=ch}cells.push(cur.trim());
  const di=cells.findIndex(c=>/^\d{1,2}\/\d{1,2}\/\d{2,4}$|^\d{4}-\d{2}-\d{2}$/.test(c));if(di<0)return;const dt=/^\d{4}/.test(cells[di])?cells[di]:txtDate(cells[di]);
  const nums=cells.map((c,i)=>({i,v:/^\(?-?\$?[\d,]+(\.\d+)?\)?$/.test(c)&&i!==di?(/^\(/.test(c)?-1:1)*+c.replace(/[()$,]/g,''):null})).filter(x=>x.v!=null);if(!nums.length)return;
  const amt=nums[0].v;
  const desc=cells.filter((c,i)=>i!==di&&!nums.some(n=>n.i===i)).join(' ').trim()||'Bank line';out.push({date:dt,desc,amt:r2(amt)})});return out}

function trkState(t){if(t.delivered||t.status==='Delivered')return'Delivered';if(t.status==='Problem')return'Problem';if(t.derived==='po'&&!t.eta)return'No date yet';
 if(t.derived==='ship')return'Shipped';if(t.eta&&t.eta<TODAY)return'Late';if(t.eta===TODAY)return'Arriving today';return t.derived==='po'?'No tracking yet':'On the way'}
const TRK_TONE={Delivered:'ok',Problem:'alert',Late:'alert','Arriving today':'warn','On the way':'info','No tracking yet':'plain','No date yet':'plain',Shipped:'info'};
const trkChip=t=>chip(trkState(t),TRK_TONE[trkState(t)]);
/* everything we're waiting on (incoming) or have sent (outgoing), including POs with no tracking yet and customer shipments logged on orders */
function trkRows(dir){const tr=ensureTracks().filter(t=>t.dir===dir);let rows=tr.slice();
 if(dir==='in')S.pos.filter(p=>p.status!=='Draft'&&poOpen(p)&&!tr.some(t=>t.ref&&t.ref.t==='po'&&t.ref.id===p.id&&!t.delivered)).forEach(p=>rows.push({derived:'po',id:p.id,dir:'in',kind:'Vendor PO',party:vend(p.vendor).name,what:p.lines.map(l=>`${num(l.qty)} × ${l.sku}`).join(', '),eta:p.exp||'',ref:{t:'po',id:p.id}}));
 if(dir==='out'){const seen=new Set(tr.map(t=>trkClean(t.number)).filter(Boolean));const g={};
  S.shipments.filter(s=>s.tracking&&!seen.has(trkClean(s.tracking))).forEach(s=>{const k=s.order+'|'+trkClean(s.tracking);const o=byId(S.orders,s.order);
   if(!g[k])g[k]={derived:'ship',id:k,dir:'out',kind:'Customer order',carrier:/ups|fedex|usps|dhl/i.test(s.carrier||'')?CARRIERS.find(c=>new RegExp(c,'i').test(s.carrier)):trkGuess(s.tracking),number:s.tracking,party:o?aname(o.acct):'',what:'',shipped:s.date,ref:{t:'order',id:s.order},by:s.by};
   g[k].what+=(g[k].what?', ':'')+`${num(s.qty)} × ${s.sku}`});rows.push(...Object.values(g))}
 return rows}
const trkSort=(a,b)=>{const r=t=>({Late:0,Problem:0,'Arriving today':1}[trkState(t)]??2);return r(a)-r(b)||(a.eta||'9999').localeCompare(b.eta||'9999')};
function trkLate(){return trkRows('in').filter(t=>['Late','Problem'].includes(trkState(t)))}
function trkToday(){return trkRows('in').filter(t=>trkState(t)==='Arriving today')}
function trkWeek(){const end=iso(addDays(T0,7));return trkRows('in').filter(t=>!t.delivered&&t.eta&&t.eta>=TODAY&&t.eta<=end)}

 const pos=S.pos.filter(p=>poOpen(p)||(v.ref&&v.ref.id===p.id)).slice().reverse(),rfqs=(S.srcReqs||[]).filter(r=>r.status!=='Closed'||(v.ref&&v.ref.id===r.id)),ords=S.orders.filter(o=>o.status!=='Completed'||(v.ref&&v.ref.id===o.id)).slice().reverse();
 const refSel=`<select name="ref"><option value="">Not linked</option>${pos.length?`<optgroup label="Vendor POs">${pos.map(p=>opt('po|'+p.id,`${p.id}, ${vend(p.vendor).name}${p.exp?' (expected '+fd(p.exp)+')':''}`,refV==='po|'+p.id)).join('')}</optgroup>`:''}${rfqs.length?`<optgroup label="RFQs (samples)">${rfqs.map(r=>opt('rfq|'+r.id,`${r.no||r.id} ${r.title}`,refV==='rfq|'+r.id)).join('')}</optgroup>`:''}${ords.length?`<optgroup label="Sales orders">${ords.map(o=>opt('order|'+o.id,`${oLabel(o)}, ${aname(o.acct)}`,refV==='order|'+o.id)).join('')}</optgroup>`:''}</select>`;

  ${fld('Expected',inp('eta',v.eta,'type="date"'))}
  ${fld('Status',`<select name="status">${['On the way','Delivered','Problem'].map(s=>opt(s,s,(v.delivered?'Delivered':v.status)===s)).join('')}</select>`)}
  ${fld('Tracking page (only if the carrier isn’t listed)',inp('url',v.url,'type="url" placeholder="https://"'))}
  ${fld('Notes',`<textarea class="input" name="notes" rows="2">${esc(v.notes||'')}</textarea>`,true)}</div>
  <p class="muted sm trk-hint" style="margin:6px 0 0">${v.number?`${esc(v.carrier||trkGuess(v.number))} · <a href="${esc(trkUrl(v))}" target="_blank" rel="noopener">Open the tracking page</a>`:'The carrier is worked out from the number. Anything not UPS, FedEx, USPS or DHL opens on 17TRACK, which covers China Post, EMS, YunExpress, Cainiao and most overseas carriers.'}</p>`,
  {label:t?'Save':'Add shipment',foot:t?`<button type="button" class="btn ghost" data-action="trk-del" data-id="${esc(t.id)}" style="margin-right:auto;color:var(--alert)">Delete</button>`:'',submit:d=>{
   const number=trkClean(d.number);if(!number&&!d.eta){toast('Add a tracking number or an expected date.',true);return false}
   const [rt,rid]=(d.ref||'').split('|');const ref=rid?{t:rt,id:rid}:null;let party=d.party.trim();const p=ref&&ref.t==='po'?byId(S.pos,ref.id):null,o=ref&&ref.t==='order'?byId(S.orders,ref.id):null;
   if(!party&&p)party=vend(p.vendor).name;if(!party&&o)party=aname(o.acct);
   if(!party&&ref&&ref.t==='rfq'){const qs=(S.squotes||[]).filter(q=>q.req===ref.id&&q.status==='Shortlisted');if(qs.length===1)party=sup(qs[0].supplier).name}
   const eta=d.eta||(p&&p.exp)||'';const delivered=d.status==='Delivered'?(t&&t.delivered)||TODAY:null;

   if(t){const ch=['number','carrier','eta','status','party'].filter(k=>(t[k]||'')!==(x[k]||'')).map(k=>({f:{number:'Tracking #',carrier:'Carrier',eta:'Expected',status:'Status',party:'From/to'}[k],from:t[k]||'',to:x[k]||''}));Object.assign(t,x);log(`Updated shipment ${t.id}${number?' ('+number+')':''}`,ch)}

   if(delivered&&p&&poOpen(p)&&!(t&&t.delivered===delivered&&t.status==='Delivered'))setTimeout(()=>{M.receive(p.id);toast('Delivered. Now record what arrived.')},0)}});

function trkTable(id,rows,dir){return table(id,[dir==='out'?'Shipped':'Expected','What',dir==='out'?'To':'From','Tracking','Linked to','Status',''],rows.map(t=>{const u=trkUrl(t),st=trkState(t);
 const when=dir==='out'?(t.shipped?fd(t.shipped):'–')+(t.eta?`<div class="muted sm">due ${fd(t.eta)}</div>`:''):(t.delivered?`<span class="muted">arrived</span> ${fd(t.delivered)}`:t.eta?fd(t.eta)+`<div class="sm ${st==='Late'?'':'muted'}" style="${st==='Late'?'color:var(--alert)':''}">${dd(t.eta)===0?'today':dd(t.eta)>0?'in '+dd(t.eta)+' day'+(dd(t.eta)===1?'':'s'):-dd(t.eta)+' day'+(dd(t.eta)===-1?'':'s')+' late'}</div>`:'<span class="muted">No date</span>');
 const acts=t.derived==='po'?btn('Add tracking','trk-new',{po:t.id},'sm')+' '+btn('Receive','po-receive',{id:t.id},'sm'):t.derived==='ship'?'':(!t.delivered?btn('Delivered','trk-done',{id:t.id},'sm')+' ':'')+btn('Edit','trk-edit',{id:t.id},'sm ghost');
 return `<tr><td class="nowrap">${when}</td><td><b>${esc(t.kind||'')}</b>${t.what?`<div class="sm">${esc(t.what)}</div>`:''}</td><td class="sm">${esc(t.party||'')}</td><td class="nowrap">${t.number?`${u?`<a href="${esc(u)}" target="_blank" rel="noopener" class="mono">${esc(t.number)}</a>`:`<span class="mono">${esc(t.number)}</span>`}<div class="muted sm">${esc(t.carrier||'')}</div>`:'<span class="muted sm">No tracking #</span>'}</td><td>${trkRefLink(t.ref)}</td><td>${trkChip(t)}</td><td class="n nowrap">${acts}</td></tr>`}),dir==='out'?'Nothing shipped with a tracking number yet.':'Nothing on the way. Add a tracking number when a vendor or supplier sends one.')}

 const inc=trkRows('in').filter(t=>!t.delivered&&t.status!=='Delivered').sort(trkSort),out=trkRows('out').filter(t=>t.derived||!t.delivered).sort((a,b)=>(b.shipped||'').localeCompare(a.shipped||''));

function trkEvents(){const ev=[];
 trkRows('in').forEach(t=>{const st=trkState(t);const d=t.delivered||t.eta;if(!d)return;ev.push({d,t,tone:t.delivered?'ok':TRK_TONE[st]||'info',label:(t.delivered?'Arrived: ':'')+(t.party||t.kind),sub:t.what||t.number||''})});
 trkRows('out').forEach(t=>{if(t.shipped)ev.push({d:t.shipped,t,tone:'wind',label:'Shipped: '+(t.party||t.kind),sub:t.what||t.number||''})});

 return ev}
function trkCalendar(){const m=ui.calM||TODAY.slice(0,7);const [y,mo]=m.split('-').map(Number);const first=new Date(y,mo-1,1),start=addDays(first,-first.getDay());const ev=trkEvents();
 const cells=[];for(let i=0;i<42;i++){const d=addDays(start,i),k=iso(d);if(i>=35&&d.getMonth()!==mo-1)break;const es=ev.filter(e=>e.d===k);
  cells.push(`<div class="cal-d ${d.getMonth()!==mo-1?'out':''} ${k===TODAY?'today':''}"><div class="cal-n">${d.getDate()}</div>${es.slice(0,3).map(e=>`<button type="button" class="cal-e ${e.tone}" data-action="cal-open" data-id="${esc(e.t.id)}" data-derived="${esc(e.t.derived||'')}" title="${esc(e.label+(e.sub?' · '+e.sub:''))}">${esc(e.label)}</button>`).join('')}${es.length>3?`<div class="muted sm">+${es.length-3} more</div>`:''}</div>`)}

 return `<div class="toolbar">${btn('‹','cal-move',{n:-1},'sm')}<b style="min-width:150px;text-align:center">${esc(label)}</b>${btn('›','cal-move',{n:1},'sm')}${btn('Today','cal-move',{n:0},'sm ghost')}<span class="grow"></span>
  <span class="sm muted" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${chip('Expected','info')}${chip('Today','warn')}${chip('Late','alert')}${chip('Arrived','ok')}${chip('Shipped out','wind')}</span>${feed}</div>

 gone.forEach(s=>{const k=aliKey(s.name);if(k&&!ignoredAli().includes(k))ignoredAli().push(k)});

 if(rq.length){const rid=new Set(rq.map(r=>r.id));S.srcReqs=S.srcReqs.filter(r=>!rid.has(r.id));(S.squotes||[]).forEach(q=>{if(rid.has(q.req))q.req=null});(S.smsgs||[]).forEach(m=>{if(rid.has(m.req))m.req=null})}

/* ================= Part requests: "can you find me…" in one place instead of texts =================
   Anyone (Denny, JJ…) asks the team to find a product. Quantity, what it's for and when it's needed are required,
   so nothing gets lost in translation. Questions and answers stay on the request, status shows who is on it,
   and every new request, question and update is emailed to info@ so the whole team sees it. */
const FR_STATUS=['New','Looking','Waiting on requester','Quoted','Ordered','Received','Closed','Can’t find'];
const FR_OPEN=s=>!['Received','Closed','Can’t find'].includes(s);
const FR_TONE={New:'warn',Looking:'info','Waiting on requester':'alert',Quoted:'wind',Ordered:'info',Received:'ok',Closed:'plain','Can’t find':'plain'};
const FR_URG=['Normal','Urgent','Machine down'];
function frs(){if(!Array.isArray(S.findReqs))S.findReqs=[];return S.findReqs}
const fr=id=>frs().find(r=>r.id===id);
const frChip=r=>chip(r.status,FR_TONE[r.status]||'plain');
const frUrg=r=>r.urgency&&r.urgency!=='Normal'?chip(r.urgency,'alert'):'';
const frDue=r=>r.needBy?`${fd(r.needBy)}${FR_OPEN(r.status)&&dd(r.needBy)<0?` <span class="sm" style="color:var(--alert)">${-dd(r.needBy)}d late</span>`:''}`:'<span class="muted">–</span>';
const frMine=r=>r.from===USER.name&&r.status==='Waiting on requester';
async function frNotify(r,what,body){if(typeof CLOUD==='undefined'||!CLOUD)return;
 const url=(location.origin+location.pathname).replace(/index\.html$/,'')+'#/requests/'+r.id;
 const L=[what,'',`${r.id}: ${r.what}`,`Quantity: ${num(r.qty)} ${r.unit||'pcs'}`,r.partNo?`Part / model: ${r.partNo}`:'',`For: ${r.forWhat||'–'}`,`Needed by: ${r.needBy?fd(r.needBy):'not set'}${r.urgency&&r.urgency!=='Normal'?' ('+r.urgency+')':''}`,`Requested by: ${r.from}`,`Who’s on it: ${r.assignee||'Anyone'}`,`Status: ${r.status}`,body?'\n'+body:'','',`Open it in the ERP: ${url}`].filter(x=>x!=='');
 try{await CLOUD.functions.invoke('mail-send',{body:{action:'notify',subject:`Part request ${r.id}: ${what.split('.')[0]} (${r.what.slice(0,60)})`,text:L.join('\n')}})}catch(e){}}

 ${fld('Who should look',`<select name="assignee">${['Anyone',...TEAM.filter(t=>!['Sales','Purchasing','Warehouse','Accounting'].includes(t))].map(t=>opt(t,t,t===(r?.assignee||'Anyone'))).join('')}</select>`)}

 ${r?'':`<div class="f full">Spec sheets, drawings or photos (optional)<input type="file" name="files" id="fr-newfiles" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,.dwg,.dxf,.step,.stp,.zip" class="input" style="padding:8px"><span class="muted sm">PDF, Word, Excel, drawings or photos, up to 25 MB each. On a phone you can take a picture.</span></div>`}</div>`,
 {label:r?'Save':'Send request',submit:d=>{const what=d.what.trim(),qty=+d.qty;
  if(!what)return fail('Say what you need.');if(!(qty>0))return fail('Add how many you need. That is the one thing that always gets lost in a text.');if(!d.forWhat.trim())return fail('Say what it is for (customer, job, order, or stock).');
  const v={what,qty,unit:d.unit,partNo:d.partNo.trim(),forWhat:d.forWhat.trim(),needBy:d.needBy||null,urgency:d.urgency,assignee:d.assignee,specs:d.specs,budget:d.budget===''?null:+d.budget};
  if(r){const b={...r};Object.assign(r,v);const ch=diffs(b,r,{what:'What',qty:'Quantity',unit:'Unit',partNo:'Part number',forWhat:'For',needBy:'Needed by',urgency:'Urgency',assignee:'Who’s on it',specs:'Specs',budget:'Budget'});if(!ch.length){toast('No changes');return}
   r.thread.push({t:new Date().toISOString(),user:USER.name,sys:true,text:'Changed '+ch.map(c=>`${c.f}: ${c.from} → ${c.to}`).join('; ')});log(`Updated part request ${r.id}`,ch);frNotify(r,`${USER.name} changed the request.`,ch.map(c=>`${c.f}: ${c.from} → ${c.to}`).join('\n'));toast('Saved');setTimeout(()=>M.fr(r.id),0)}
  else{const pick=[...(($('#fr-newfiles')||{}).files||[])];const id=nextId(frs(),'FR-');const n={id,...v,from:USER.name,created:new Date().toISOString(),status:'New',thread:[]};frs().unshift(n);

   toast(`${id} sent to the team`);setTimeout(()=>{location.hash='#/requests/'+id},0)}}})};

 modal(`${r.id}: ${r.what}`,`<div class="grid2e" style="gap:18px"><div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${frChip(r)}${frUrg(r)}</div>

function frPost(r,text,status){const t=new Date().toISOString();if(text)r.thread.push({t,user:USER.name,text});

 if(r.status==='Waiting on requester'&&USER.name===r.from&&text){r.thread.push({t,user:USER.name,sys:true,text:'Status: Waiting on requester → Looking'});r.status='Looking'}
 if(USER.name!==r.from&&text){if(r.status==='New')r.status='Looking';if(!r.assignee||r.assignee==='Anyone')r.assignee=USER.name}}

/* ---------- attachments: spec sheets, drawings, photos, quotes ---------- */
const FR_BUCKET='request-files',FR_MAX=25*1048576;
const frCloud=()=>typeof CLOUD!=='undefined'&&CLOUD;
const frSize=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const frIcon=f=>/^image\//.test(f.type||'')?'🖼':/pdf/.test(f.type||'')||/\.pdf$/i.test(f.name)?'📄':/sheet|excel|csv/.test(f.type||'')||/\.(xlsx?|csv)$/i.test(f.name)?'📊':'📎';
const frPicker=id=>`<input type="file" id="${id}" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,.dwg,.dxf,.step,.stp,.zip" style="display:none">`;
async function frUpload(r,files){if(!frCloud())return toast('Attachments work in the online ERP.',true);files=[...files||[]];if(!files.length)return 0;if(!Array.isArray(r.files))r.files=[];let ok=0;
 for(const f of files){if(f.size>FR_MAX){toast(`${f.name} is over 25 MB. Put it in OneDrive or Google Drive and paste the link instead.`,true);continue}
  const path=`${r.id}/${Date.now()}-${f.name.replace(/[^\w.\- ]+/g,'_')}`;toast(`Uploading ${f.name}…`);
  const {error}=await CLOUD.storage.from(FR_BUCKET).upload(path,f,{contentType:f.type||'application/octet-stream',upsert:false});
  if(error){toast(`Could not upload ${f.name}: ${/bucket|not found/i.test(error.message)?'run mres-request-files.sql in Supabase first':error.message}`,true);continue}
  r.files.push({name:f.name,path,size:f.size,type:f.type,by:USER.name,t:new Date().toISOString()});ok++}
 if(ok){r.thread=r.thread||[];r.thread.push({t:new Date().toISOString(),user:USER.name,sys:true,text:`Attached ${ok} file${ok===1?'':'s'}`});log(`${USER.name} attached ${ok} file${ok===1?'':'s'} to part request ${r.id}`);save()}
 return ok}
function frFiles(r){const fs=r.files||[];return `<div class="sm muted" style="margin:14px 0 4px">Files${fs.length?' ('+fs.length+')':''}</div>`
 +(fs.length?fs.map((f,i)=>`<div style="display:flex;gap:8px;align-items:center;padding:4px 0;border-top:1px solid var(--line)"><span>${frIcon(f)}</span><button type="button" class="link grow" style="text-align:left" data-action="fr-file" data-id="${esc(r.id)}" data-i="${i}">${esc(f.name)}</button><span class="muted sm nowrap">${frSize(f.size||0)} · ${esc(f.by||'')}</span>${f.by===USER.name||isOwner()?`<button type="button" class="link sm" data-action="fr-file-del" data-id="${esc(r.id)}" data-i="${i}" aria-label="Remove ${esc(f.name)}">✕</button>`:''}</div>`).join(''):'<div class="muted sm">No files yet.</div>')
 +`<div style="margin-top:6px">${frPicker('fr-pick')}${btn('📎 Attach spec sheet, drawing or photo','fr-attach',{id:r.id},'sm')}</div>`}
A['fr-attach']=d=>{const el=$('#fr-pick');if(!el)return;el.onchange=async()=>{const r=fr(d.id);const n=await frUpload(r,el.files);if(n){toast(`${n} file${n===1?'':'s'} attached`);frNotify(r,`${USER.name} attached ${n} file${n===1?'':'s'}.`,r.files.slice(-n).map(f=>'• '+f.name).join('\n'));M.fr(r.id);rerender()}};el.click()};
A['fr-file']=async d=>{const f=(fr(d.id)?.files||[])[+d.i];if(!f||!frCloud())return;const {data,error}=await CLOUD.storage.from(FR_BUCKET).createSignedUrl(f.path,600);if(error)return toast('Could not open the file: '+error.message,true);window.open(data.signedUrl,'_blank','noopener')};

 cpOpen({fresh:true,title:`Email quote ${q.id}`,acct:q.acct||null,conv:conv?conv.id:null,files:[file],onSent:(data,body)=>{const sentTo=body.to[0];const ch=[];if(q.status==='Draft'){ch.push(...stCh('Draft','Sent'));q.status='Sent'}q.sentOn=TODAY;q.sentTo=sentTo;q.by=q.by||USER.name;
   if(c&&c.id&&!c.email){c.email=sentTo;ch.push({f:`${c.name} email`,from:'blank',to:c.email})}log(`Emailed quote ${q.id} to ${sentTo}`,ch);if(data&&data.conversationId)rowQ.add(data.conversationId);kick();rerender()}});
 CP.to=to?[to.toLowerCase()]:[];CP.subject=conv?reSubj(conv.subject):`Quote ${q.id} from Mass Renewable Energy Solutions`;CP.body=msg;CP.link='quote|'+q.id;if(conv)CP.from=defaultFrom(conv);cpRender()};
A['quote-fu']=async d=>{const q=byId(S.quotes,d.id);if(!q)return;const c=acct(q.acct)||{};const conv=quoteConv(q);closeModal();const to=q.sentTo||c.email||(conv&&conv.from)||'';const first=(c.contact||'').split(/\s+/)[0];
 const msg=q.fuCount?`Hi${first?' '+first:''},\n\nChecking in once more on quote ${q.id}. If the timing or quantities have changed, I'm happy to re-quote. If you've gone another way, just let me know and I'll close it out.\n\nThank you,`
  :`Hi${first?' '+first:''},\n\nI wanted to follow up on our quote ${q.id}${q.sentOn?` from ${longDate(q.sentOn)}`:''}. Do you have any questions, or would you like us to adjust quantities or lead time? We can get the order moving as soon as we have your PO.\n\nThank you,`;
 let file=null;try{file=await pdfFile(q)}catch(e){}
 cpOpen({fresh:true,title:`Follow up on ${q.id}`,acct:q.acct||null,conv:conv?conv.id:null,files:file?[file]:[],onSent:(data,body)=>{q.fuOn=TODAY;q.fuCount=(q.fuCount||0)+1;if(!q.sentTo)q.sentTo=body.to[0];log(`Emailed a follow-up on quote ${q.id} to ${body.to[0]}`,[{f:'Follow-ups',from:String(q.fuCount-1),to:String(q.fuCount)}]);if(data&&data.conversationId)rowQ.add(data.conversationId);kick();rerender()}});
 CP.to=to?[to.toLowerCase()]:[];CP.subject=conv?reSubj(conv.subject):`Following up: quote ${q.id} from Mass Renewable Energy Solutions`;CP.body=msg;CP.link='quote|'+q.id;if(conv)CP.from=defaultFrom(conv);cpRender()};
/* photos: Send to a customer opens the same window with the photo attached, labelled with the part number */
A['ph-send']=async d=>{const it=item(d.sku);const ps=phOf(d.sku);if(!it||!ps.length)return;const pick=d.i!=null?[ps[+d.i]]:ps.slice(0,Math.min(ps.length,3));closeModal();toast('Getting the photo ready…');
 let att;try{att=await phAttach(it.sku,pick,true)}catch(e){return toast(e.message,true)}const files=att.map(a=>{const bin=atob(a.content),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new File([u],a.filename,{type:'image/jpeg'})});
 cpOpen({fresh:true,title:`Photo of ${it.sku}`,files,onSent:(data,body)=>log(`Emailed ${files.length} photo${files.length===1?'':'s'} of ${it.sku} to ${body.to.join(', ')}`)});
 CP.subject=`Photo of part ${it.sku}${it.desc?' – '+it.desc:''}`;CP.body=`Hi,\n\nAttached is a photo of what we have: part # ${it.sku}${it.desc?' ('+it.desc+')':''}.\n\nWould this work for you? If you need something different, send us a photo or the part number of what you have and we'll find the right match.\n\nThank you,`;cpRender()};
